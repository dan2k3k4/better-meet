name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check syntax
        run: |
          for f in *.js; do node --check "$f"; done
          jq empty manifest.json
          jq -e '.description | length <= 132' manifest.json # Chrome Web Store limit

      - name: Package
        run: make zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: better-meet
          path: better-meet.zip

  # Only this job can write to the repo, and only for v* tags.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version"; exit 1; }
          make zip
          gh release create "$GITHUB_REF_NAME" better-meet.zip --generate-notes
