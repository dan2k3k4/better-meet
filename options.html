<!doctype html>
<meta charset="utf-8">
<title>Better Meet options</title>
<style>body { font: 14px system-ui; padding: 12px; } label { display: block; margin: 6px 0; }</style>
<label><input type="checkbox" id="muteMic"> Join with microphone off</label>
<label><input type="checkbox" id="muteCam"> Join with camera off</label>
<label><input type="checkbox" id="notifyWaiting"> Notify when someone is waiting to join</label>
<label><input type="checkbox" id="timer"> Show time since I joined</label>
<label><input type="checkbox" id="hotMic"> Warn me if I leave the Meet tab with my mic on</label>
<p><small>Changes apply when you next open or reload a Meet.</small></p>
<script src="options.js"></script>
